version: '3.8'

services:
  # Stream Relay - HTTP relay for streaming LLM/TTS APIs
  relay:
    build:
      # Build context is the repo root (two levels up) so the Dockerfile
      # can see go.mod, cmd/, internal/ and configs/.
      context: ../..
      dockerfile: Dockerfile
    image: stream-relay-go:latest
    container_name: relay-app
    ports:
      - "8080:8080"
    # API keys are read from the environment by config.yaml (os.ExpandEnv)
    # and per-route auth_env. Copy ../../.env.example to ../../.env.
    env_file:
      - ../../.env
    volumes:
      - relay-logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Redis - 用于实时查询
  redis:
    image: redis:7-alpine
    container_name: relay-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ClickHouse - 用于数据持久化和分析
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: relay-clickhouse
    ports:
      - "8123:8123"  # HTTP
      - "9000:9000"  # Native
    environment:
      CLICKHOUSE_DB: relay
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: relay123
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  redis-data:
  clickhouse-data:
  relay-logs:
